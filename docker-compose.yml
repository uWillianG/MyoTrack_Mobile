# Nome distinto do compose do repositório .NET, que também se chamaria "myotrack". Dois
# arquivos com o mesmo nome de projeto compartilham os containers: rodar
# `docker compose down --remove-orphans` aqui apagaria os serviços do outro repositório, que
# aparecem como órfãos. Descoberto ao subir isto pela primeira vez.
name: myotrack-mobile

# Infraestrutura de desenvolvimento: o banco e o armazenamento de mídia.
#
# A API e o Worker NÃO estão aqui de propósito. Eles rodam por `gradlew bootRun`, que é como
# se desenvolve neste repositório — com recompilação a cada mudança, sem reconstruir imagem.
# Containerizá-los só passa a valer no dia em que houver deploy, e um Dockerfile que ninguém
# executa apodrece sem avisar.
#
# O serviço de visão está aqui, e o código dele também, em `vision/`. É a exceção à regra
# acima, e por um motivo diferente: ele não é recompilado a cada mudança como a API e o Worker
# — é um processo Python que sobe uma vez e fica. Fora do compose, ele era um container criado
# à mão que morria junto com o Docker Desktop e não voltava, e o sintoma no app era "o serviço
# de análise não respondeu", que parece problema de servidor.
#
# Os valores abaixo são exatamente os padrões de myotrack-shared.yml. Isso é intencional:
# `docker compose up -d` seguido de `gradlew bootRun` funciona sem configurar nada.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: myotrack
      POSTGRES_USER: myotrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 5433 no host para não conflitar com um PostgreSQL nativo na 5432. Preso a 127.0.0.1:
      # um banco com senha "dev-only-password" não pode ficar exposto na rede local.
      - "127.0.0.1:5433:5432"
    healthcheck:
      # A API roda as migrations do Flyway na subida e falha se o banco ainda não aceita
      # conexão. `depends_on` sozinho só espera o container existir, não o Postgres responder.
      test: ["CMD-SHELL", "pg_isready -U myotrack -d myotrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-myotrack}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-only-password}
    volumes:
      - minio-data:/data
    ports:
      # 9000 é a API S3; 9001 é o console web.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Análise de execução por vídeo (FastAPI + MediaPipe Pose).
  #
  # O código está em `vision/`, neste repositório. Ele já viveu fora — no repo `MyoTrack` —, e
  # a distância cobrava caro: o container era criado à mão contra a rede do outro projeto, uma
  # heurística só se conferia abrindo dois repositórios, e ninguém tinha como saber, olhando
  # daqui, qual versão estava rodando.
  vision:
    build:
      context: ./vision
    environment:
      # Pelo nome do serviço, não por localhost: dentro do container, `localhost` é ele mesmo.
      # É o erro que fazia o download do vídeo falhar e virar "o serviço não respondeu".
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-myotrack}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dev-only-password}
      S3_BUCKET: myotrack-media
    ports:
      # Preso a 127.0.0.1 como os demais. O Worker roda no host e procura o serviço em
      # `http://localhost:8000` (`MYOTRACK_VISION_BASE_URL`), que é este mapeamento.
      - "127.0.0.1:8000:8000"
    depends_on:
      minio:
        condition: service_healthy
    # Sem `curl` na imagem (python:3.11-slim), então a checagem usa a stdlib.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Analisar vídeo é pesado; o serviço aceita conexão bem antes de estar ocioso.
      start_period: 20s
    restart: unless-stopped

# O bucket `myotrack-media` não é criado aqui: quem o cria é o MinioMediaStorage, na primeira
# escrita. Um container de bootstrap com `mc mb` seria uma segunda coisa a manter em sincronia
# com o nome do bucket.

volumes:
  postgres-data:
  minio-data:
