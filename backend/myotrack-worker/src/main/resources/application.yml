spring:
  application:
    name: myotrack-worker
  config:
    import: classpath:myotrack-shared.yml
  main:
    web-application-type: none
  # Só a API aplica as migrations — dois processos migrando ao mesmo tempo disputam o lock.
  flyway:
    enabled: false

myotrack:
  llm:
    # "openai" ou "gemini". Vazio = autodetecção pela chave preenchida (Gemini tem precedência,
    # por ser o mais barato por token — quem quiser o outro nomeia aqui).
    provider: ${MYOTRACK_LLM_PROVIDER:}
    # Vazio nas duas = geração usa apenas o motor de regras, sem chamada externa.
    openai-api-key: ${MYOTRACK_OPENAI_API_KEY:}
    openai-model: ${MYOTRACK_OPENAI_MODEL:gpt-5-mini}
    gemini-api-key: ${MYOTRACK_GEMINI_API_KEY:}
    gemini-model: ${MYOTRACK_GEMINI_MODEL:gemini-3.5-flash}
    # Análise ilustrada de refeição: exige chave com billing; sem cota, cai no renderizador local.
    #
    # É a chamada mais cara do app por uma ordem de grandeza — geração de imagem, cobrada por
    # imagem e não por token de texto. O renderizador local (MealImageAnnotator) produz a mesma
    # anotação de graça, e é o que roda hoje. Ligar billing aqui é uma decisão de custo, não de
    # configuração: ver a seção "Custo de IA" do README antes.
    gemini-image-model: ${MYOTRACK_GEMINI_IMAGE_MODEL:gemini-3.1-flash-image}
    # Nos modelos com raciocínio, os tokens de "thinking" contam dentro deste teto.
    max-tokens: 8192

  vision:
    base-url: ${MYOTRACK_VISION_BASE_URL:http://localhost:8000}
    timeout-seconds: 600

  retention:
    video-days: 30
    meal-photo-days: 90

  push:
    # Notificação nos aparelhos quando um job termina. Vazio = as notificações são escritas no
    # log do Worker e não saem daqui — é o padrão em desenvolvimento, e permite conferir texto e
    # rota sem aparelho e sem projeto no Firebase.
    #
    # As DUAS variáveis são necessárias: metade configurada mantém o modo log, porque o id do
    # projeto sem credencial não autentica e a credencial sem o id não sabe para onde enviar.
    fcm-project-id: ${MYOTRACK_FCM_PROJECT_ID:}
    # Conteúdo do JSON da conta de serviço do Firebase, não o caminho do arquivo: em container o
    # arquivo teria de ser montado, e uma variável de ambiente já é como as outras chaves chegam.
    fcm-credentials-json: ${MYOTRACK_FCM_CREDENTIALS_JSON:}

logging:
  level:
    root: INFO
