spring:
  application:
    name: myotrack-worker
  config:
    import: classpath:myotrack-shared.yml
  main:
    web-application-type: none
  # Só a API aplica as migrations — dois processos migrando ao mesmo tempo disputam o lock.
  flyway:
    enabled: false

myotrack:
  llm:
    # "anthropic" ou "gemini". Vazio = autodetecção pela chave preenchida (Anthropic tem precedência).
    provider: ${MYOTRACK_LLM_PROVIDER:}
    # Vazio = geração usa apenas o motor de regras, sem chamada externa.
    anthropic-api-key: ${MYOTRACK_ANTHROPIC_API_KEY:}
    model: ${MYOTRACK_LLM_MODEL:claude-opus-4-8}
    gemini-api-key: ${MYOTRACK_GEMINI_API_KEY:}
    gemini-model: ${MYOTRACK_GEMINI_MODEL:gemini-3.5-flash}
    # Análise ilustrada de refeição: exige chave com billing; sem cota, cai no modo padrão.
    gemini-image-model: ${MYOTRACK_GEMINI_IMAGE_MODEL:gemini-3.1-flash-image}
    # Nos modelos com raciocínio, os tokens de "thinking" contam dentro deste teto.
    max-tokens: 8192

  vision:
    base-url: ${MYOTRACK_VISION_BASE_URL:http://localhost:8000}
    timeout-seconds: 600

  retention:
    video-days: 30
    meal-photo-days: 90

logging:
  level:
    root: INFO
