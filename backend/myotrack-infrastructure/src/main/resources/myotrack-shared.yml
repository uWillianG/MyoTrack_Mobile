# Configuração comum à API e ao Worker (importada por ambos via spring.config.import).
# Espelha ConnectionStrings:Default e a seção Storage dos appsettings.json do .NET.

spring:
  datasource:
    # O compose expõe o Postgres na 5433 do host para não conflitar com uma instalação nativa na 5432.
    url: ${MYOTRACK_DB_URL:jdbc:postgresql://localhost:5433/myotrack}
    username: ${MYOTRACK_DB_USER:myotrack}
    password: ${MYOTRACK_DB_PASSWORD:dev-only-password}

  jpa:
    open-in-view: false
    hibernate:
      # O schema vem do Flyway (V1__baseline.sql). O Hibernate só confere se o
      # mapeamento bate — divergência falha no startup, que é o que queremos.
      ddl-auto: validate
      naming:
        # Sem esta estratégia, o Hibernate converteria "WorkoutPlans" em "workout_plans"
        # e nada casaria com o schema criado pelo Npgsql.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # Os identificadores do schema são PascalCase; sem aspas o Postgres os dobraria para minúsculo.
        globally_quoted_identifiers: true
        jdbc:
          time_zone: UTC

myotrack:
  storage:
    endpoint: ${MYOTRACK_STORAGE_ENDPOINT:http://localhost:9000}
    # Endpoint que o CLIENTE alcança nas URLs pré-assinadas (ex.: https://dominio/media).
    # Vazio = usa o endpoint acima, suficiente em desenvolvimento.
    public-endpoint: ${MYOTRACK_STORAGE_PUBLIC_ENDPOINT:}
    access-key: ${MYOTRACK_STORAGE_ACCESS_KEY:myotrack}
    secret-key: ${MYOTRACK_STORAGE_SECRET_KEY:dev-only-password}
    bucket: ${MYOTRACK_STORAGE_BUCKET:myotrack-media}
    # Precisa estar certa para o public-endpoint funcionar: sem região declarada o SDK vai
    # perguntá-la ao servidor antes de assinar, e o endereço público costuma não ser
    # alcançável de dentro do backend.
    region: ${MYOTRACK_STORAGE_REGION:us-east-1}
