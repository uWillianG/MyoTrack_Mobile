name: myotrack
description: "MyoTrack - personal trainer e nutricionista digital"
# Pacote privado: nunca vai para o pub.dev.
publish_to: 'none'

# build-name (1.0.0) vira versionName no Android e CFBundleShortVersionString no iOS;
# build-number (+1) vira versionCode e CFBundleVersion. As lojas exigem que o build-number
# aumente a cada envio.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# POLÍTICA DE DEPENDÊNCIAS
# Cada pacote entra aqui na funcionalidade que o usa, não antes. Um plugin declarado cedo
# demais é código nativo compilado a cada build sem entregar nada — e quando ele é
# incompatível com o template Android atual, quebra o build inteiro por uma funcionalidade
# que ainda nem começou (foi o que aconteceu com workmanager e jni).
dependencies:
  flutter:
    sdk: flutter
  # Traduções dos widgets do Material/Cupertino para pt-BR.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Estado e injeção (substitui ViewModel + Hilt do plano Android) ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Navegação ---
  go_router: ^14.6.2

  # --- Rede ---
  # dio: cliente HTTP com interceptors — é neles que mora a renovação de token no 401.
  dio: ^5.7.0

  # --- Modelos e JSON ---
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # --- Sessão ---
  # Keychain no iOS, EncryptedSharedPreferences no Android.
  flutter_secure_storage: ^9.2.2

  # --- Login social (B1) ---
  google_sign_in: ^6.2.2
  # A App Store exige esta opção em app que ofereça login social de terceiros (diretriz 4.8).
  sign_in_with_apple: ^6.1.3

  # --- Banco local e escrita offline (B6) ---
  # A academia é o lugar onde o app mais é usado e onde menos há sinal: registrar série
  # precisa funcionar sem rede. O que não subiu fica numa fila local até subir.
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  # A implementação Android precisa ficar abaixo da 2.3.x: a partir dela o path_provider
  # passa a depender do jni, cujo build.gradle não compila no AGP 9 / Gradle 9.1. O acento
  # circunflexo não serve aqui — ele permitiria a 2.3.x.
  path_provider_android: '>=2.2.17 <2.3.0'
  path: ^1.9.0
  # Sincronização em background (B6). A fila só subia quando o usuário escrevia de novo —
  # quem registrou o treino no subsolo e guardou o celular ficava com tudo parado no
  # aparelho por tempo indeterminado. Aqui o sistema operacional acorda o app quando houver
  # rede. A 0.5.x não serve: usa a API v1 do WorkManager, já removida.
  workmanager: ^0.9.0+3

  # --- Timer de descanso (B4) ---
  # O descanso precisa avisar mesmo com o app em segundo plano: entre uma série e outra o
  # celular vai para o bolso, e um Timer do Dart não sobrevive a isso. A notificação é
  # agendada no relógio do sistema, que continua correndo.
  flutter_local_notifications: ^22.2.0
  # zonedSchedule trabalha com TZDateTime, não com DateTime.
  timezone: ^0.11.1
  # Mantém a tela ligada durante o treino: com as mãos na barra, ninguém volta a tocar no
  # aparelho a cada 30 segundos só para ele não apagar.
  wakelock_plus: ^1.5.2

  # --- Foto de refeição (B7) ---
  # image_picker cobre câmera e galeria usando a do sistema. O pacote `camera` ficou de fora:
  # ele serve para preview dentro do app, e aqui não há nada a fazer com o preview — a foto
  # vai inteira para a IA. Um plugin nativo a mais custa build e não entrega nada.
  image_picker: ^1.2.3
  # A foto sai da câmera com vários MB; a IA analisa igual de bem com 1600 px. Comprimir
  # antes de subir é a diferença entre subir na hora e travar no Wi-Fi da academia.
  flutter_image_compress: ^2.5.1

  # --- Análise de vídeo (B9) ---
  # Reproduz o vídeo com o esqueleto desenhado que o serviço de visão devolve. O envio reusa o
  # image_picker do B7 (`pickVideo`), sem plugin novo para isso.
  video_player: ^2.9.2

  # --- Dashboard (B10) ---
  # Gráficos de evolução. Todos de série única: as cores do tema reprovam como paleta
  # categórica (ΔE 7,7 entre primary e tertiary na visão normal, contra um piso de 15 —
  # indistinguíveis lado a lado), mas passam de sobra no contraste contra a superfície.
  fl_chart: ^1.2.0
  # Formatação de data e de número em pt-BR: "1.250 kg" e não "1250 kg".
  intl: ^0.20.2

  # --- Assinatura (B14) ---
  # As duas lojas proíbem cobrar conteúdo digital por fora do sistema delas, então o Stripe
  # que a web usa não serve aqui. Quem decide se o Pro vale é sempre o servidor: o app manda
  # o recibo e o backend valida contra a loja.
  in_app_purchase: ^3.3.0

  # --- Links externos (B3) ---
  # Abre o vídeo do exercício no TikTok. Exige <queries> no AndroidManifest: do Android 11
  # em diante o app não enxerga quem trata https sem declarar. No iOS o link https vai por
  # universal link e não precisa de entrada no Info.plist.
  url_launcher: ^6.3.1

  # --- Portabilidade de dados (LGPD) ---
  # Entrega o export à folha de compartilhamento do sistema: dali a pessoa salva no Drive,
  # manda para si mesma ou abre num leitor de JSON — sem o app precisar de permissão de
  # armazenamento, sem escolher pasta e sem um navegador de arquivos próprio.
  #
  # Entrou agora, e não antes, porque até aqui o export só saía por e-mail: onde o SMTP não
  # está configurado o servidor responde 503, e o direito à portabilidade simplesmente não
  # chegava ao titular. O endpoint que devolve o arquivo já existia (`GET /api/privacy/export`)
  # e nunca tinha sido ligado.
  share_plus: ^12.0.2

  # --- Aba Conta ---
  # Versão e build do app, e o nome do pacote. Aparecem em dois lugares da aba: no rodapé, que
  # é o que se pede a quem relata um problema, e dentro do e-mail de suporte, já preenchido —
  # ninguém sabe de cabeça em que build está. O nome do pacote é o que monta o `market://` do
  # link de avaliação, e lê-lo do próprio app evita uma constante que silenciosamente diverge
  # do `applicationId` no dia em que ele mudar. A faixa é a que o wakelock_plus já resolve por
  # baixo do pano: declará-la aqui não traz código nativo novo, só o torna importável.
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Geração de código: freezed/json_serializable/riverpod_generator.
  # Nada disso é versionado — o CI roda build_runner antes de analisar.
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.5

  # Testes de rede sem tocar a rede.
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # A FONTE DO APP
  #
  # Manrope, empacotada. Durante muito tempo este projeto usou a fonte de cada plataforma
  # (Roboto no Android, San Francisco no iOS) com o argumento de que "uma fonte que chega pela
  # rede é uma fonte que às vezes não chega no subsolo de uma academia". O argumento continua
  # certo — e não se aplica aqui: esta vai **dentro do APK**, disponível no primeiro frame,
  # sem rede nenhuma. O que se paga são 165 KB, uma vez.
  #
  # O que se compra é a diferença entre um app desenhado e um app padrão do Android. A fonte
  # do sistema é o carimbo mais visível de "Flutter recém-criado", e nenhum arranjo de layout
  # o remove.
  #
  # **Um arquivo variável, e não cinco estáticos.** As instâncias estáticas da Manrope têm
  # 326 KB cada por causa do charset completo: os cinco pesos dariam 1,6 MB. O arquivo
  # variável entrega o eixo `wght` inteiro (200–800) em 165 KB, e o Flutter interpola o peso
  # a partir do `fontWeight` do `TextStyle` — a galeria visual em `test/design` é onde isso
  # se confere, e é por isso que ela existe.
  #
  # Licença OFL, versionada ao lado do binário e registrada em `main.dart`.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf

  assets:
    - assets/fonts/OFL.txt
