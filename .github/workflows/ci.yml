name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch — o job do macOS é
# o mais caro da conta e não vale a pena rodar duas vezes para o mesmo código.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build e testes
        run: ./gradlew build --no-daemon

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/*/build/reports/tests/test
          retention-days: 7

  vision:
    name: Vision — testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # A mesma do Dockerfile: mediapipe só suporta 3.9–3.11.
          python-version: '3.11'

      # Sem `pip install -r requirements.txt` de propósito. Os testes dublam cv2 e mediapipe
      # em sys.modules — nenhum deles exercita a rede neural —, e instalar mediapipe são
      # ~200 MB de download para não usar nada disso.
      - name: Testes
        run: |
          python tests/test_heuristics.py
          python tests/test_analysis.py

  app-analyze:
    name: App — análise e testes
    runs-on: ubuntu-latest
    # O `build_runner` não morre quando um builder estoura: ele registra o erro e fica
    # pendurado. Sem teto, isso não vira falha — vira o job batendo nas 6h de limite do
    # runner e sendo cancelado, que é como este passo passou uma semana quebrado sem
    # ninguém ver um vermelho. Vinte minutos: a geração leva ~1min e a suíte ~2min.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # **Versão pinada, e não `channel: stable` solto.** Os outros dois jobs já fixam a
          # deles — Java 21, Python 3.11 —, e este era o único que mudava de toolchain
          # sozinho a cada release do Flutter. Não é preferência: o `analyzer` que o lockfile
          # prende entende linguagem 3.9.0, e quando o stable chegou ao Dart 3.13 o código do
          # próprio framework passou a usar *dot shorthands* que aquele analyzer não sabe
          # visitar — `Missing implementation of visitDotShorthandPropertyAccess`, dentro do
          # riverpod_generator, em toda execução.
          #
          # Subir de Flutter passa a ser um commit deliberado, que troca este número e sobe
          # o analyzer e os geradores junto, num lugar onde dá para ver o que quebrou.
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      # freezed/json_serializable/riverpod_generator geram código que não é versionado.
      - name: Gerar código
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Análise estática
        run: flutter analyze --fatal-infos

      - run: flutter test

  app-android:
    name: App — build Android
    runs-on: ubuntu-latest
    needs: app-analyze
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug

  app-ios:
    name: App — build iOS
    # O desenvolvimento acontece no Windows, onde não é possível compilar iOS.
    # Sem este job, uma quebra de iOS só apareceria na hora de publicar.
    runs-on: macos-latest
    needs: app-analyze
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Sem assinatura: valida que o projeto Xcode, os pods e o código Dart compilam
      # para iOS. Assinar exigiria certificados da conta de desenvolvedor nos secrets.
      - run: flutter build ios --no-codesign --debug
