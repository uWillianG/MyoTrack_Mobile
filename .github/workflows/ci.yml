name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch — o job do macOS é
# o mais caro da conta e não vale a pena rodar duas vezes para o mesmo código.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build e testes
        run: ./gradlew build --no-daemon

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/*/build/reports/tests/test
          retention-days: 7

  app-analyze:
    name: App — análise e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # freezed/json_serializable/riverpod_generator geram código que não é versionado.
      - name: Gerar código
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Análise estática
        run: flutter analyze --fatal-infos

      - run: flutter test

  app-android:
    name: App — build Android
    runs-on: ubuntu-latest
    needs: app-analyze
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug

  app-ios:
    name: App — build iOS
    # O desenvolvimento acontece no Windows, onde não é possível compilar iOS.
    # Sem este job, uma quebra de iOS só apareceria na hora de publicar.
    runs-on: macos-latest
    needs: app-analyze
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Sem assinatura: valida que o projeto Xcode, os pods e o código Dart compilam
      # para iOS. Assinar exigiria certificados da conta de desenvolvedor nos secrets.
      - run: flutter build ios --no-codesign --debug
